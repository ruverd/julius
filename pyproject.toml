[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "julius-local"
version = "0.2.0"
description = "Local evidence-aware context optimization and usage accounting"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3"]

[project.scripts]
julius = "julius.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12", "mypy>=1.15", "maturin>=1.9,<2"]

[tool.maturin]
python-source = "python"
module-name = "julius._native"
manifest-path = "crates/julius-py/Cargo.toml"
include = ["python/julius/data/repo_task_pilot.json", "python/julius/data/jev_shadow_cases.json"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["python/julius"]
check_untyped_defs = true
ignore_missing_imports = true
