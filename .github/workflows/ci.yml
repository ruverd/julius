name: Verify
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --frozen
      - run: sh scripts/dev.sh test
      - run: sh scripts/dev.sh build
      - run: uv run --no-sync python scripts/wheel_smoke.py dist/wheels/*.whl
