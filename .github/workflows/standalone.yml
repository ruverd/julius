name: Standalone development archives

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --frozen
      - name: Read package version
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'JULIUS_VERSION={version}\n')
          PY
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$JULIUS_VERSION"
      - run: sh scripts/dev.sh test
      - run: sh scripts/build_standalone.sh
      - run: test "$(dist/standalone/julius --version)" = "julius-local $JULIUS_VERSION (Python + Rust)"
      - run: python3 scripts/package_standalone.py --version "$JULIUS_VERSION" --output dist/julius-${{ runner.os }}-${{ runner.arch }}.tar.gz
      - run: python3 scripts/archive_smoke.py dist/julius-${{ runner.os }}-${{ runner.arch }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: julius-unsigned-${{ runner.os }}-${{ runner.arch }}
          path: dist/julius-${{ runner.os }}-${{ runner.arch }}.tar.gz
          if-no-files-found: error
